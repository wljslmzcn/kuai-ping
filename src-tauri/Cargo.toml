[package]
name = "kuai-ping"
version = "1.0.0"
edition = "2021"

[lib]
name = "kuai_ping_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
regex = "1"
futures = "0.3"
encoding_rs = "0.8"
